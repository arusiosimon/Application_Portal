
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> MUST ADMISSION PORTAL  | Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="form-container">

        <header class="form-header">

            <img src="Photo/must-logo.png"
     alt="Mbarara University of Science and Technology logo"
     class="logo">

            <h1 class="university-title">
                MBARARA UNIVERSITY OF SCIENCE AND TECHNOLOGY
            </h1>

            <h2 class="application-title">
                MUST ADMISSION PORTAL
            </h2>

            <p class="form-subtitle">Login</p>

        </header>

        <section class="form-content" aria-label="Login form">

            <form action="/login" method="POST">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit">Log In</button>

            </form>

            <nav class="form-links" aria-label="Account assistance">
                <a href="/forgot-password">Forgot Password?</a>
            </nav>

        </section>

        <footer class="form-footer">
            <p>
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>
        </footer>

    </main>

</body>
</html>
